name: Reparar microfono automatico

on:
  push:
    paths:
      - '.github/workflows/fix-microfono-auto.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-microfono:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener sitio actual
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar reparacion minima y protegida
        run: python3 .github/scripts/fix_microfono_auto.py

      - name: Validar que no cambio nada mas
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          echo "Archivos modificados: $changed"
          test "$changed" = "index.html"
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert s.count('CENZONTLE_MIC_AUTO_HOTFIX_20260831') == 1
          assert 'id="mic-global"' in s
          assert 'Mic.iniciar' in s and 'Mic.vivo' in s and 'Mic.liberar' in s
          print('Validacion estructural OK')
          PY
          git diff --stat -- index.html

      - name: Publicar reparacion
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No hay cambios que publicar"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: restaurar activacion automatica del microfono"
          git push
